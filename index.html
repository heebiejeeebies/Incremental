<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incremental</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
        text-align: center;
      }
      .tree-button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .tree-button img {
        width: 1200px;
        max-width: 85vw;
        display: block;
      }
      .bevis-image {
        width: 200px;
        position:absolute;
        top: 500px;
        left: 500px;
      }
      .tree-container {
        position: relative;
        display: inline-block;
        margin-left: 250px;
      }
      .leaf-image {
        position: absolute;
        width: 40px;
        pointer-events: none;
      }
      .meteor-container {
        position: absolute;
        top: 8%;
        left: 12%;
        transform: translate(-50%, -50%) rotate(-45deg);
        transition: top 3s linear, left 3s linear;
        pointer-events: none;
      }
      .meteor-container.flying {
        top: 50%;
        left: 50%;
      }
      .meteor-img {
        position: absolute;
        top: 0;
        left: 30%;
        width: 100%;
        height: 100%;
      }
      .fire-img {
        position: absolute;
        top: 0;
        left: 15%;
        transform: rotate(-30deg);
        width: 100%;
        height: 100%;
      }
      .explosion-image {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300px;
        max-width: 60vw;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
