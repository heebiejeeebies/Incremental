<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incremental</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        text-align: center;
      }
      .world {
        position: static;
        background-position: top left;
        background-repeat: no-repeat;
      }
      .hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding-top: 1rem;
        pointer-events: none;
        z-index: 30;
      }
      .hud button {
        pointer-events: auto;
      }
      .tree-button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .tree-button img {
        width: 1200px;
        max-width: 85vw;
        display: block;
      }
      .bevis-image {
        position: absolute;
        width: 200px;
      }
      .tree-container {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .leaf-image {
        position: absolute;
        width: 40px;
        pointer-events: none;
      }
      .fruit-image {
        position: absolute;
        width: 70px;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
      .meteor-container {
        position: absolute;
        transform: translate(-50%, -50%) rotate(-45deg);
        transition: top 3s linear, left 3s linear;
        pointer-events: none;
      }
      .meteor-img {
        position: absolute;
        top: 0;
        left: 30%;
        width: 100%;
        height: 100%;
      }
      .fire-img {
        position: absolute;
        top: 0;
        left: 15%;
        transform: rotate(-30deg);
        width: 100%;
        height: 100%;
      }
      .explosion-image {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 900px;
        max-width: 95vw;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10;
      }
      .game-over-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-size: 6rem;
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        z-index: 40;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
