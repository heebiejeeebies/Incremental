<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incremental</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        text-align: center;
      }
      .world {
        position: static;
        background-color: #4a90e2;
      }
      .ground-image {
        position: absolute;
        top: 0;
        left: 0;
      }
      .sun-image {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .controls {
        position: absolute;
        text-align: left;
        z-index: 20;
      }
      .stats-panel {
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        text-align: left;
        z-index: 20;
      }
      .stats-panel p {
        margin: 0.25rem 0;
      }
      .tree-button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .tree-button img {
        width: 1200px;
        max-width: 85vw;
        display: block;
      }
      .bevis-image {
        position: absolute;
        width: 200px;
      }
      .tree-container {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .leaf-image {
        position: absolute;
        width: 40px;
        pointer-events: none;
      }
      .fruit-image {
        position: absolute;
        width: 70px;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
      .dinosaur-button {
        position: absolute;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .dinosaur-button img {
        width: 140px;
        display: block;
      }
      .parked-dinosaur {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .parked-dinosaur-button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .parked-dinosaur-button img {
        width: 180px;
        display: block;
      }
      .poop-image {
        position: absolute;
        width: 60px;
        cursor: pointer;
      }
      .sell-dinosaur-button {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        margin-top: 0.25rem;
      }
      .meteor-container {
        position: absolute;
        transition: top 3s linear, left 3s linear;
        pointer-events: none;
      }
      .meteor-img {
        position: absolute;
        top: 0;
        left: 30%;
        width: 100%;
        height: 100%;
      }
      .fire-img {
        position: absolute;
        top: 0;
        left: 15%;
        transform: rotate(-30deg);
        width: 100%;
        height: 100%;
      }
      .explosion-image {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 900px;
        max-width: 95vw;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10;
      }
      .game-over-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-size: 6rem;
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        z-index: 40;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
